<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonflower</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
<style>

html,body{height:100%;margin:0}

#v{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 38%,rgba(0,0,10,.72) 100%)}

.ss{position:fixed;left:0;top:0;width:150px;height:2px;border-radius:2px;pointer-events:none;opacity:0;z-index:1;background:linear-gradient(90deg,rgba(190,210,255,0),rgba(235,242,255,.95));filter:drop-shadow(0 0 4px rgba(190,210,255,.85))}

@media (prefers-reduced-motion:reduce){#f{animation:none;opacity:0}}

#hint.on{opacity:.75}

#fb{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 20px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(10,8,30,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:20px;font-style:italic}

#pick button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A lotus made of glowing particles that gather out of the night sky and scatter from touch"></canvas>
<div id="v"></div><div id="f"></div>
<div id="hint">drag to turn the flower</div>
<div id="pick"><div id="list" hidden></div><button type="button" id="fb" aria-label="Choose a flower" aria-expanded="false"><span id="fd"></span><span id="fn"></span></button></div>
<script>
(function(){
var cv=document.getElementById('c'),hint=document.getElementById('hint');

function R(){return Math.random()}

var A=[],TB=0,PAL=null,SHP={a:1.15,b:.7,n:0},PP=small?2200:3800,GN=1.15,HE=0,PV=null;
function add(x,y,z,c,br,sz,d,t){A.push(x,y,z,R()*2-1,R()*2-1,c[0]*br,c[1]*br,c[2]*br,d+TB,sz,R(),t)}
